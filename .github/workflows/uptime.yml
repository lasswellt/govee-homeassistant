name: Govee API Uptime

# Pings the Govee hosts this integration uses and publishes a status badge +
# uptime-bars graph to the orphan `badges` branch (keeps main history clean).

on:
  schedule:
    - cron: "17 * * * *" # hourly at :17
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-badges # serialize with install-stats so branch pushes don't race
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    # Needs write to push the orphan `badges` branch; everything else is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false # publish step pushes with an explicit token

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore existing badges-branch artifacts
        run: |
          mkdir -p out
          git fetch origin badges || true
          if git rev-parse --verify origin/badges >/dev/null 2>&1; then
            git --work-tree=out checkout origin/badges -- . || true
            git reset -q   # unstage; out/ keeps the files
          fi

      - name: Generate uptime artifacts
        run: python scripts/status_badges.py uptime --data-dir out --repo-dir .

      - name: Publish to badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b badges
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "chore(badges): uptime update [skip ci]" || { echo "no changes"; exit 0; }
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
