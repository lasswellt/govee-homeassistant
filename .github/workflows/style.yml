name: Style check

on:
  push:
  pull_request:

jobs:
  style:
    runs-on: "ubuntu-latest"
    name: Check style formatting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Pinned to the version in .pre-commit-config.yaml so both runs agree.
      - run: python3 -m pip install black==26.5.1
      # --check fails the job on unformatted files; --diff shows what to fix.
      - run: black --check --diff .
      # Repo Claude settings must never ride in via a PR (release job ignores them).
      - name: Forbid committed Claude settings
        run: |
          if git ls-files '.claude/settings*.json' | grep -q .; then echo "::error::.claude/settings*.json must not be committed (the release job ignores repo Claude settings, see SECURITY.md)"; exit 1; fi
